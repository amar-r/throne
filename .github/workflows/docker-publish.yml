name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: &non-image-paths
      - '**.md'
      - 'compose.yaml'
      - 'docker-compose.yml'
      - '.github/**'
      - '!.github/workflows/docker-publish.yml'
  pull_request:
    branches: [main]
    paths-ignore: *non-image-paths

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - run: npm ci

      # There is no test suite by design, so a syntax check on both JS files
      # plus a container that actually answers /api/health is the whole gate.
      - name: Syntax check
        run: |
          node -c server.js
          node -c public/metrics.js

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Build and smoke test
        run: |
          docker build -t throne:ci .
          docker run -d --name throne-ci -p 8440:8440 throne:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8440/api/health; then echo "healthy"; exit 0; fi
            sleep 1
          done
          echo "never became healthy"; docker logs throne-ci; exit 1

  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: mrrthr/throne
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
